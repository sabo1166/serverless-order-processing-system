
# Terraform CI/CD
# Flow: init -> validate -> plan -> apply
#
# init and validate run on pull requests and pushes to main.
# plan runs only on pushes to main.
# apply requires a successful plan, changes, and dev-approval environment approval.
#
# AWS authentication uses GitHub OIDC. No static AWS access keys.

name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_region: ${{ vars.AWS_REGION }}

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Terraform version
        run: terraform version | head -n 1 | grep -qx "Terraform v${TF_VERSION}"

      - name: Terraform init (offline, lock file read-only)
        run: terraform -chdir=terraform/environments/dev init -backend=false -lockfile=readonly -no-color

  validate:
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Share provider downloads between configurations
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tf-plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tf-plugin-cache"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive -no-color terraform

      - name: Terraform init and validate all configurations
        run: |
          set -euo pipefail
          for dir in terraform/bootstrap terraform/environments/dev terraform/modules/*/; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

  plan:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-plan-main
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform/environments/dev

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubTerraformPlanRole
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Plan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init (S3 backend)
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$BUCKET"
          test -n "$REGION"
          terraform init -input=false -no-color \
            -backend-config="bucket=$BUCKET" \
            -backend-config="region=$REGION"

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out=tfplan
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No infrastructure changes detected."
          elif [ "$code" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Infrastructure changes detected."
          else
            echo "Terraform plan failed with exit code $code."
            exit "$code"
          fi

      - name: Upload saved Terraform plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plan
          path: terraform/environments/dev/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: dev-approval

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-dev-apply
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubTerraformPlanRole
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Apply-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init (S3 backend)
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$BUCKET"
          test -n "$REGION"
          terraform init -input=false -no-color \
            -backend-config="bucket=$BUCKET" \
            -backend-config="region=$REGION"

      - name: Download reviewed Terraform plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-plan
          path: terraform/environments/dev

      - name: Terraform apply saved plan
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
