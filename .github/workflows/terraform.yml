# Four jobs: init -> validate -> plan -> apply.
# - init and validate run on pull requests and pushes to main. They use NO AWS credentials.
# - plan and apply are HARD-DISABLED (`if: ${{ false }}`). They have no AWS credentials step and no
#   `id-token: write` permission, so they cannot authenticate to AWS even if the `if` were removed.
#   Enabling either one requires a separate, reviewed change that adds the AWS OIDC credentials step,
#   `id-token: write`, and least-privilege IAM (GitHubTerraformPlanRole must not keep AdministratorAccess).
# - When apply is eventually enabled it will RE-PLAN and run `terraform apply -auto-approve`, which can
#   apply different changes than the plan job showed, with no human approval step. Add an approval gate
#   before enabling it.
name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_region: ${{ vars.AWS_REGION }}

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Verify Terraform version
        run: terraform version | head -n 1 | grep -qx "Terraform v${TF_VERSION}"
      # Offline init (no backend, no AWS). -lockfile=readonly fails if the committed lock file
      # does not match the provider constraints, so provider versions cannot drift silently.
      - name: Terraform init (offline, lock file read-only)
        run: terraform -chdir=terraform/environments/dev init -backend=false -lockfile=readonly -no-color

  validate:
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Share provider downloads between configurations
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tf-plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tf-plugin-cache"
      - name: Terraform fmt check
        run: terraform fmt -check -recursive -no-color terraform
      - name: Terraform init (no backend) and validate bootstrap, dev, and all modules
        run: |
          set -euo pipefail
          for dir in terraform/bootstrap terraform/environments/dev terraform/modules/*/; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

  plan:
    needs: validate
    # HARD-DISABLED. Do not change to a variable or expression. No AWS credentials step and no
    # id-token permission exist in this job on purpose; see the header comment.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # deliberately NO id-token
    concurrency:
      group: terraform-plan-main
      cancel-in-progress: false # never kill a run that holds the state lock
    defaults:
      run:
        working-directory: terraform/environments/dev
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # (AWS credentials step intentionally absent.)
      - name: Terraform init (S3 backend)
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: terraform init -no-color -backend-config="bucket=$BUCKET" -backend-config="region=$REGION"
      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi

  apply:
    needs: plan
    # HARD-DISABLED. Do not change to a variable or expression. No AWS credentials step and no
    # id-token permission exist in this job on purpose; see the header comment.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # deliberately NO id-token
    concurrency:
      group: terraform-dev-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # (AWS credentials step intentionally absent.)
      - name: Terraform init (S3 backend)
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: terraform init -no-color -backend-config="bucket=$BUCKET" -backend-config="region=$REGION"
      - name: Terraform apply
        run: terraform apply -no-color -lock-timeout=5m -auto-approve
